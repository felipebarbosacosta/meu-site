<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meu-site | página</title>
<style>
  :root {
    --bg: #dbeafe;
    --text: #1d2733;
    --muted: #5b6978;
    --accent: #2563eb;
    --card: #ffffff;
    --line: #bfd3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --text: #e8edf2;
      --muted: #9aa7b5;
      --accent: #6ea0ff;
      --card: #1a212a;
      --line: #2c3642;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  h1 { margin: 0 0 8px; font-size: 1.75rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  button {
    font: inherit;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #resultado { margin-top: 20px; min-height: 1.6em; color: var(--text); font-weight: 600; }
  .whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  .whatsapp:hover { border-color: #25d366; }
  .whatsapp:focus-visible { outline: 3px solid #25d366; outline-offset: 2px; }
  .whatsapp svg { width: 28px; height: 28px; flex: none; }
</style>
</head>
<body>
  <main>
    <h1>Meu site está no ar</h1>
    <p>TESTANDO MUDAANÇA NA PÁGIA DIRETO NO GITHUB TESTE.</p>
    <button id="botao" type="button">Testar o JavaScript</button>
    <div id="resultado" aria-live="polite"></div>

    <a class="whatsapp" href="https://wa.me/5511999999999" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#25d366"/>
        <path d="M16 7.2a8.8 8.8 0 0 0-7.6 13.2L7.2 24.8l4.5-1.2A8.8 8.8 0 1 0 16 7.2z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12.6 12.2c.3-.5.7-.5 1-.4l.7 1.6c.1.3 0 .5-.2.7l-.5.6c.7 1.3 1.7 2.200 3 2.800l.6-.6c.2-.2.5-.3.7-.1l1.500.8c.3.200.3.600.1 1-.5.900-1.400 1.300-2.400 1.100-3-.6-5-3.200-5.200-5-.1-.7.1-1.100.4-1.500z" fill="#fff"/>
      </svg>
      <span>(11) 99999-9999</span>
    </a>
  </main>

  <script>
    document.getElementById("botao").addEventListener("click", function () {
      var agora = new Date().toLocaleString("pt-BR");
      document.getElementById("resultado").textContent = "JavaScript funcionando. Horário: " + agora;
    });
  </script>
</body>
</html>
