<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meu-site | página de teste</title>
<style>
  :root {
    --bg: #f5f7fa;
    --text: #1d2733;
    --muted: #5b6978;
    --accent: #2563eb;
    --card: #ffffff;
    --line: #d9e0e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --text: #e8edf2;
      --muted: #9aa7b5;
      --accent: #6ea0ff;
      --card: #1a212a;
      --line: #2c3642;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
  }
  h1 { margin: 0 0 8px; font-size: 1.75rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  button {
    font: inherit;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #resultado { margin-top: 20px; min-height: 1.6em; color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>Meu site está no ar</h1>
    <p>Se você está vendo esta página, o arquivo foi enviado ao repositório e o site funciona.</p>
    <button id="botao" type="button">Testar o JavaScript</button>
    <div id="resultado" aria-live="polite"></div>
  </main>

  <script>
    document.getElementById("botao").addEventListener("click", function () {
      var agora = new Date().toLocaleString("pt-BR");
      document.getElementById("resultado").textContent = "JavaScript funcionando. Horário: " + agora;
    });
  </script>
</body>
</html>
